[project]
name = "langgraph-dev-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.22",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
